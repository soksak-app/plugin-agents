<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그룹 추가</title>
  <style>
    /* The view bridge sets the theme of the window on the root: --card, --fg, --muted, --edge and --fail, with its color scheme. */
    :root { --text: var(--fg); --line: var(--edge); --error: var(--fail); }
    body { margin: 0; padding: 0 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    .card { box-sizing: border-box; width: 100%; max-width: 360px; margin: 12vh auto 0; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    label { display: block; margin: 0 0 12px; color: var(--muted); }
    input { display: block; box-sizing: border-box; width: 100%; margin-top: 4px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--text); font: inherit; }
    p { margin: 0 0 12px; min-height: 1.4em; color: var(--error); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    button { padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <h1>그룹 추가</h1>
    <label>그룹 이름 <input id="name" type="text" maxlength="40" autocomplete="off"></label>
    <p id="error" role="alert"></p>
    <div class="actions">
      <button id="cancel" type="button">취소</button>
      <button id="add" type="button">추가</button>
    </div>
  </main>
  <script type="module" src="group-dialog.js"></script>
</body>
</html>
