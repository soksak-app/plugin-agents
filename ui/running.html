<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실행 중인 에이전트</title>
  <style>
    /* The view bridge sets the theme of the window on the root: --card, --fg, --muted, --edge and --fail, with its color scheme. */
    :root { --text: var(--fg); --line: var(--edge); --error: var(--fail); }
    body { margin: 0; padding: 12px 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    #tree { height: calc(100vh - 24px); min-height: 48px; margin: 0 -16px; }
    #empty { color: var(--muted); }
  </style>
</head>
<body>
  <div id="tree"></div>
  <p id="empty" hidden>실행 중인 에이전트가 없어요.</p>
  <script type="module" src="running-view.js"></script>
</body>
</html>
