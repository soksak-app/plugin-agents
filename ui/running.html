<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실행 중인 에이전트</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; } }
    :root[data-theme="dark"] { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; }
    body { margin: 0; padding: 12px 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    p { margin: 6px 0 2px; font-weight: 600; }
    button { display: block; width: 100%; margin: 0; padding: 4px 8px; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    button:hover { background: var(--line); }
    #empty { color: var(--muted); }
  </style>
</head>
<body>
  <div id="tree"></div>
  <p id="empty" hidden>실행 중인 에이전트가 없어요.</p>
  <p>정의 시작</p>
  <div id="definitions"></div>
  <p id="no-definitions" hidden>시작할 정의가 없어요.</p>
  <script type="module" src="running-view.js"></script>
</body>
</html>
