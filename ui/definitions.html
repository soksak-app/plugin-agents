<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>에이전트 정의</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; } }
    :root[data-theme="dark"] { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; }
    body { margin: 0; padding: 12px 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    #groups { height: calc(100vh - 24px); min-height: 48px; margin: 0 -16px; }
    ul { margin: 0 0 12px; padding: 0; list-style: none; }
    li { padding: 6px 0; border-bottom: 1px solid var(--line); }
    p { margin: 0 0 12px; color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="groups"></div>
  <p id="empty">그룹이 없어요.</p>
  <script type="module" src="definitions.js"></script>
</body>
</html>
