<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>혼</title>
  <style>
    /* The view bridge sets the theme of the window on the root: --card, --fg, --muted, --edge and --fail, with its color scheme. */
    :root { --text: var(--fg); --line: var(--edge); --error: var(--fail); }
    body { margin: 0; padding: 0 16px 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    .card { box-sizing: border-box; width: 100%; max-width: 420px; max-height: calc(100vh - 48px); margin: 24px auto 0; padding: 16px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    label { display: block; margin: 0 0 10px; color: var(--muted); }
    input, select, textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 4px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--text); font: inherit; }
    textarea { resize: vertical; min-height: 44px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    p { margin: 0 0 12px; min-height: 1.4em; color: var(--error); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .row { display: flex; gap: 6px; align-items: flex-end; margin: 0 0 10px; }
    .row input, .row select { margin-top: 0; }
    .row button { flex: none; }
    .new { color: var(--muted); }
    .card.signing { max-width: 760px; height: calc(100vh - 48px); display: flex; flex-direction: column; overflow: hidden; }
    .card.signing > :not(.signing-part) { display: none; }
    #login-page { flex: 1 1 auto; min-height: 0; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 4px; }
    [hidden] { display: none !important; }
    button:disabled { opacity: 0.5; cursor: default; }
    button { padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="signing-part">혼</h1>
    <label>이름 <input id="name" type="text" maxlength="40" autocomplete="off"></label>
    <label for="account" class="signing-part">계정</label>
    <div class="row signing-part"><select id="account"></select><button id="login" type="button" disabled>로그인</button><button id="login-cancel" type="button" hidden>로그인 취소</button></div>
    <div id="login-page" class="signing-part" hidden></div>
    <div class="new">새 계정</div>
    <div class="row"><input id="account-id" type="text" placeholder="식별자" autocomplete="off"><input id="account-cli" type="text" placeholder="cli (claude, codex)" autocomplete="off"><button id="account-add" type="button">추가</button></div>
    <label>작업 폴더 (절대 경로) <input id="cwd" type="text" autocomplete="off"></label>
    <label>역할 텍스트 <textarea id="text" rows="4"></textarea></label>
    <label>역할 텍스트 (한국어) <textarea id="ko" rows="4"></textarea></label>
    <label>역할 파일 (절대 경로, 한 줄에 하나) <textarea id="files" rows="3"></textarea></label>
    <p id="error" class="signing-part" role="alert"></p>
    <div class="actions">
      <button id="cancel" type="button">취소</button>
      <button id="save" type="button">저장</button>
    </div>
  </main>
  <script type="module" src="definition-dialog.js"></script>
</body>
</html>
