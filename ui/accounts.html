<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>에이전트 계정</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; } }
    :root[data-theme="dark"] { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; }
    body { margin: 0; padding: 12px 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    ul { margin: 0 0 12px; padding: 0; list-style: none; }
    li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
    li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    p { margin: 0 0 12px; color: var(--muted); }
    form { display: flex; flex-direction: column; gap: 8px; }
    form > div { display: flex; gap: 8px; }
    input, textarea { min-width: 0; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
    input { flex: 1; }
    textarea { flex: 1; resize: vertical; }
    button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
    #define { margin-top: 12px; }
  </style>
</head>
<body>
  <ul id="accounts"></ul>
  <p id="empty">계정이 없어요.</p>
  <p>같은 식별자로 정의하면 그 계정을 바꿔요. 인자와 환경 변수 이름은 줄마다 하나씩 적어요.</p>
  <form id="define">
    <div>
      <input id="define-id" type="text" placeholder="계정 식별자 (예: claude-main)" aria-label="계정 식별자">
      <input id="define-cli" type="text" placeholder="실행 파일 이름 (예: claude)" aria-label="실행 파일 이름">
    </div>
    <textarea id="define-args" rows="2" placeholder="인자, 한 줄에 하나" aria-label="인자"></textarea>
    <textarea id="define-env" rows="2" placeholder="환경 변수 이름, 한 줄에 하나" aria-label="환경 변수 이름"></textarea>
    <div><button type="submit">계정 정의</button></div>
  </form>
  <script type="module" src="accounts-view.js"></script>
</body>
</html>
